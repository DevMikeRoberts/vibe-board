# Build the two application images, publish them to ECR, refresh the deploy
# bundle in S3, and run the deploy on the EC2 host through SSM.
#
# The instance is reached over SSM rather than SSH, so nothing here needs an
# inbound port. Authentication prefers OIDC and falls back to static keys:
#   1. secret AWS_DEPLOY_ROLE_ARN  — OIDC, no standing credentials (preferred)
#   2. secrets AWS_ACCESS_KEY (or AWS_ACCESS_KEY_ID) + AWS_SECRET_ACCESS_KEY
# The role is created by infra/terraform, so keys are the bootstrap path; once
# the stack exists, set the role ARN and delete the keys.
#
# Required repository configuration (see docs/AWS_DEPLOYMENT.md):
#   secret   AWS_DEPLOY_ROLE_ARN   role created by infra/terraform (or keys)
#   variable AWS_REGION, AWS_DEPLOY_BUCKET, ECR_SERVER_REPO, ECR_WEB_REPO,
#            EC2_NAME_TAG, IMAGE_PLATFORM
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'images/**'
      - 'docs/**'
      - '.squad/**'
      - 'infra/terraform/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to redeploy (rollback). Leave empty to build this commit.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

# One deploy at a time, and never cancel one midway — a half-applied compose
# stack is worse than a queued job.
concurrency:
  group: deploy-aws-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  # Mirrored into env because `secrets` is not a valid context in a step `if:`.
  AWS_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

jobs:
  # Keeps the workflow green on forks and before the AWS side is configured.
  guard:
    name: Check AWS configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
        run: |
          have_creds=false
          if [ -n "$ROLE_ARN" ]; then
            have_creds=true
          elif [ -n "$ACCESS_KEY" ] && [ -n "$SECRET_KEY" ]; then
            have_creds=true
          fi

          # AWS_DEPLOY_BUCKET only exists once Terraform has been applied, so it
          # doubles as the signal that there is anything to deploy *to*.
          if [ "$have_creds" = true ] && [ -n "$DEPLOY_BUCKET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS deployment is not configured yet (needs credentials plus the AWS_DEPLOY_BUCKET variable that 'terraform apply' produces) — skipping."
          fi

  build:
    name: Build & push images
    needs: guard
    if: needs.guard.outputs.configured == 'true' && inputs.image_tag == ''
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-${{ github.run_id }}

      - name: Configure AWS credentials (access keys)
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # QEMU is only needed when the instance is arm64 (t4g.*) and the runner
      # is not. Emulated builds are slow but avoid a second runner.
      - name: Set up QEMU
        if: vars.IMAGE_PLATFORM == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_SERVER_REPO }}:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_SERVER_REPO }}:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          platforms: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_WEB_REPO }}:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_WEB_REPO }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to EC2
    needs: [guard, build]
    if: |
      always() && needs.guard.outputs.configured == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Configure AWS credentials (access keys)
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The compose file, Caddyfiles and deploy.sh are versioned with the app
      # and delivered separately from the images, so a proxy or deploy-logic
      # change ships without rebuilding or replacing anything.
      - name: Publish deploy bundle
        run: |
          aws s3 sync infra/deploy "s3://${{ vars.AWS_DEPLOY_BUCKET }}/deploy/" \
            --delete --only-show-errors
          echo "Synced $(find infra/deploy -type f | wc -l) files to s3://${{ vars.AWS_DEPLOY_BUCKET }}/deploy/"

      - name: Run deploy over SSM
        id: ssm
        env:
          IMAGE_TAG: ${{ inputs.image_tag || needs.build.outputs.image_tag }}
          NAME_TAG: ${{ vars.EC2_NAME_TAG || 'agentboard-prod' }}
        run: |
          set -euo pipefail

          if [ -z "$IMAGE_TAG" ]; then
            echo "::error::No image tag to deploy."
            exit 1
          fi

          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NAME_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)"

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running instance tagged Name=$NAME_TAG in $AWS_REGION."
            exit 1
          fi
          echo "Deploying $IMAGE_TAG to $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

          PARAMS="$(jq -nc --arg cmd "/usr/local/bin/agentboard-deploy $IMAGE_TAG" '{commands:[$cmd]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE_TAG:0:12} from GitHub Actions" \
            --timeout-seconds 900 \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)"
          echo "SSM command: $COMMAND_ID"

          # Poll for up to 15 minutes; image pulls on a t3.micro are not fast.
          STATUS=Pending
          for _ in $(seq 1 90); do
            sleep 10
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "::group::Deploy output"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent \
            --output text || true
          echo "::endgroup::"

          if [ "$STATUS" != "Success" ]; then
            echo "::group::Deploy errors"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query StandardErrorContent \
              --output text || true
            echo "::endgroup::"
            echo "::error::Deploy finished with status $STATUS"
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          IMAGE_TAG: ${{ inputs.image_tag || needs.build.outputs.image_tag }}
        run: |
          {
            echo "### Deploy to AWS"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image tag | \`$IMAGE_TAG\` |"
            echo "| Instance | \`${{ steps.ssm.outputs.instance_id }}\` |"
            echo "| Region | \`$AWS_REGION\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
