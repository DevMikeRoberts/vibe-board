# ONE-OFF, DELETE THIS WORKFLOW ONCE IT HAS RUN.
#
# Terraform (infra) run 31450993251 created 41 AWS resources and then discarded
# its state, because backend.tf declared no `backend "s3"` block and Terraform
# fell back to local state on the runner. Nothing tracks those resources, so
# `terraform destroy` cannot reach them — they have to be deleted by ID.
#
# The script this runs contains the 41 IDs from that run's log and touches
# nothing else: no tag sweep, no wildcards. It refuses to run against any
# account other than 880255526061, and it leaves the Terraform state bucket
# alone.
#
# Manual dispatch only, and only when "DELETE" is typed into the input.
name: Teardown orphaned infra (one-off)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to permanently remove the 41 orphaned resources'
        required: true
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  teardown:
    name: Teardown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The input goes through the environment rather than being interpolated
      # into the script body, so a crafted value is compared as data instead of
      # being run as shell.
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DELETE" ]; then
            echo "::error::Confirmation input did not match. Type DELETE exactly to proceed. Nothing was changed."
            exit 1
          fi

      # Same credential order as infra.yml. The secrets context is not usable in
      # a step-level `if`, so the choice is resolved here and read as an output.
      - name: Determine auth
        id: auth
        env:
          ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$ACCESS_KEY" ] && [ -n "$SECRET_KEY" ]; then
            echo "method=keys" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No AWS credentials configured — set AWS_TERRAFORM_ROLE_ARN, or AWS_ACCESS_KEY + AWS_SECRET_ACCESS_KEY."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.auth.outputs.method == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-teardown-${{ github.run_id }}

      - name: Configure AWS credentials (access keys)
        if: steps.auth.outputs.method == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Printed first so the log shows exactly what is about to go, and so a
      # mis-scoped script is visible before it deletes anything.
      - name: Dry run
        run: ./infra/scripts/teardown-orphans-31450993251.sh

      - name: Delete
        run: ./infra/scripts/teardown-orphans-31450993251.sh --yes

      - name: Verify nothing is left
        run: |
          {
            echo "### Teardown verification"
            echo '```'
            echo "instance: $(aws ec2 describe-instances --instance-ids i-0ca5ef56ddf86b08a \
              --query 'Reservations[].Instances[].State.Name' --output text 2>&1 || echo gone)"
            echo "vpc:      $(aws ec2 describe-vpcs --vpc-ids vpc-0a4e9983a58b1fa65 \
              --query 'Vpcs[].VpcId' --output text 2>&1 || echo gone)"
            echo "roles:    $(aws iam list-roles \
              --query "Roles[?starts_with(RoleName,'agentboard-prod')].RoleName" --output text)"
            echo "ecr:      $(aws ecr describe-repositories \
              --query "repositories[?starts_with(repositoryName,'agentboard-prod')].repositoryName" \
              --output text 2>&1 || echo gone)"
            echo "ssm:      $(aws ssm get-parameters-by-path --path /agentboard/prod \
              --query 'Parameters[].Name' --output text)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
