# Terraform for the AWS deployment. Plans on every PR that touches infra, and
# applies only from a manual dispatch that types "apply" — infrastructure
# changes here can replace the instance, so they are never automatic.
#
# Required repository configuration:
#   secret   AWS_TERRAFORM_ROLE_ARN   role with permission to manage the stack
#   variable AWS_REGION, TF_STATE_BUCKET, TF_STATE_KEY
name: Terraform (infra)

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Type "apply" to apply the plan; anything else only plans.'
        required: true
        default: plan
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: 'true'

defaults:
  run:
    working-directory: infra/terraform

jobs:
  terraform:
    name: ${{ inputs.action == 'apply' && 'Apply' || 'Plan' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Check AWS configuration
        id: check
        env:
          ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -n "$ROLE_ARN" ] && [ -n "$STATE_BUCKET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Terraform CI is not configured (missing AWS_TERRAFORM_ROLE_ARN or TF_STATE_BUCKET) — validating syntax only."
          fi

      # Without a backend, `terraform validate` still type-checks the whole
      # configuration, so a broken PR fails even before AWS is wired up.
      - name: Validate (no backend)
        if: steps.check.outputs.configured != 'true'
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Configure AWS credentials
        if: steps.check.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-terraform-${{ github.run_id }}

      - name: Init
        if: steps.check.outputs.configured == 'true'
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'prod/terraform.tfstate' }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate
        if: steps.check.outputs.configured == 'true'
        run: terraform validate

      - name: Plan
        if: steps.check.outputs.configured == 'true'
        id: plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: steps.check.outputs.configured == 'true' && inputs.action == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
