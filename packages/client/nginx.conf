# Static file server for the built client. TLS, compression, access logging and
# authentication all happen at the Caddy edge — this only resolves SPA routes.
server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames, so assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on stale JS.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
